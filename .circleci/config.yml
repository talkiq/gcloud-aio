version: 2.1

orbs:
  linter: talkiq/linter@4.0.1
  poetry: talkiq/poetry@4.2.1

executors:
  python311:
    docker:
      - image: python:3.11.18
    resource_class: small

  python312:
    docker:
      - image: python:3.12.16
    resource_class: small

  python313:
    docker:
      - image: python:3.13.18
    resource_class: small

  python314:
    docker:
      - image: python:3.14.10
    resource_class: small

  python315:
    docker:
      - image: python:3.15.2
    resource_class: small

  python-integration:
    docker:
      - image: python:3.14.10
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /key.json
    resource_class: small

  python-emulator-bigquery:
    docker:
      - image: python:3.14.10
      - image: ghcr.io/goccy/bigquery-emulator:0.8.1
        command: [--project=dialpad-oss, --port=9050]
    environment:
      BIGQUERY_EMULATOR_HOST: localhost:9050
    resource_class: small

  python-emulator-datastore:
    docker:
      - image: python:3.14.10
      - image: gcr.io/google.com/cloudsdktool/google-cloud-cli:591.0.0-emulators
        command: [gcloud, emulators, firestore, start, --database-mode=datastore-mode, --host-port=0.0.0.0:8081]
    environment:
      DATASTORE_EMULATOR_HOST: localhost:8081
    resource_class: small

  python-emulator-storage:
    docker:
      - image: python:3.14.10
      - image: fsouza/fake-gcs-server:1.56.1
        command: [-scheme, http, -port, '4443', -external-url, http://localhost:4443]
    environment:
      STORAGE_EMULATOR_HOST: http://localhost:4443
    resource_class: small

commands:
  store-rest:
    description: >
      Stores the files created by `bin/build-rest` for use in subsequent jobs.
      Also uploads the artifacts to CircleCI for manual debugging.
    steps:
      - persist_to_workspace:
          root: ./build
          paths:
          - ./*
      - run:
          name: build gcloud-rest tarballs
          command: |
            mkdir rest
            tar cf rest/auth.tgz auth
            tar cf rest/bigquery.tgz bigquery
            tar cf rest/datastore.tgz datastore
            tar cf rest/kms.tgz kms
            tar cf rest/pubsub.tgz pubsub
            tar cf rest/storage.tgz storage
            tar cf rest/taskqueue.tgz taskqueue
          working_directory: build
      - store_artifacts:
          path: ./build/rest/

jobs:
  build-rest:
    executor: python314
    steps:
      - poetry/install:
          # renovate: datasource=pypi depName=poetry
          version: 2.5.1
      - checkout
      - run: ./bin/build-rest
      - store-rest

workflows:
  run-jobs:
    jobs:
      # build gcloud-rest-*
      - build-rest

      # run linters
      - linter/pre-commit:
          # N.B. keep this pinned to the oldest 3.x to make sure we maintain
          # support.
          executor: python311

      # run tests
      - poetry/run:
          name: test-unit-/aio/<<matrix.cwd>>-<<matrix.executor>>
          commands:
            - run:
                command: poetry run pytest tests/unit
                working_directory: <<matrix.cwd>>
          install_flags: --no-ansi
          # renovate: datasource=pypi depName=poetry
          version: 2.5.1
          matrix:
            alias: test-unit-aio
            parameters:
              cwd: [auth, bigquery, datastore, kms, pubsub, storage, taskqueue]
              executor: [python311, python312, python313, python314, python315]
      - poetry/run:
          name: test-unit-<<matrix.cwd>>-<<matrix.executor>>
          commands:
            - run:
                command: poetry run pytest tests/unit
                working_directory: <<matrix.cwd>>
          install_flags: --no-ansi
          # renovate: datasource=pypi depName=poetry
          version: 2.5.1
          pre-steps:
            - attach_workspace:
                at: /rest
          matrix:
            alias: test-unit-rest
            parameters:
              cwd: [/rest/auth, /rest/bigquery, /rest/datastore, /rest/kms, /rest/pubsub, /rest/storage, /rest/taskqueue]
              executor: [python311, python312, python313, python314, python315]
          requires:
            - build-rest

      # Integration tests which need no secrets, so also run on fork PRs. Each
      # package gets its own executor to avoid pulling unneeded emulators.
      - poetry/run:
          name: test-emulator-/aio/bigquery-emulator
          cwd: bigquery
          commands:
            - run:
                command: poetry run pytest tests/integration
                working_directory: bigquery
          executor: python-emulator-bigquery
          install_flags: --no-ansi
          # renovate: datasource=pypi depName=poetry
          version: 2.5.1
      - poetry/run:
          name: test-emulator-/aio/datastore-emulator
          cwd: datastore
          commands:
            - run:
                command: poetry run pytest tests/integration
                working_directory: datastore
          executor: python-emulator-datastore
          install_flags: --no-ansi
          # renovate: datasource=pypi depName=poetry
          version: 2.5.1
      - poetry/run:
          name: test-emulator-/aio/storage-emulator
          cwd: storage
          commands:
            - run:
                command: poetry run pytest tests/integration
                working_directory: storage
          executor: python-emulator-storage
          install_flags: --no-ansi
          # renovate: datasource=pypi depName=poetry
          version: 2.5.1
      - poetry/run:
          name: test-emulator-/rest/bigquery-emulator
          cwd: /rest/bigquery
          commands:
            - run:
                command: poetry run pytest tests/integration
                working_directory: /rest/bigquery
          executor: python-emulator-bigquery
          install_flags: --no-ansi
          # renovate: datasource=pypi depName=poetry
          version: 2.5.1
          pre-steps:
            - attach_workspace:
                at: /rest
          requires:
            - build-rest
      - poetry/run:
          name: test-emulator-/rest/datastore-emulator
          cwd: /rest/datastore
          commands:
            - run:
                command: poetry run pytest tests/integration
                working_directory: /rest/datastore
          executor: python-emulator-datastore
          install_flags: --no-ansi
          # renovate: datasource=pypi depName=poetry
          version: 2.5.1
          pre-steps:
            - attach_workspace:
                at: /rest
          requires:
            - build-rest
      - poetry/run:
          name: test-emulator-/rest/storage-emulator
          cwd: /rest/storage
          commands:
            - run:
                command: poetry run pytest tests/integration
                working_directory: /rest/storage
          executor: python-emulator-storage
          install_flags: --no-ansi
          # renovate: datasource=pypi depName=poetry
          version: 2.5.1
          pre-steps:
            - attach_workspace:
                at: /rest
          requires:
            - build-rest

  # Fork PR pipelines (branch `pull/<N>`) receive no secrets, so these would
  # only ever fail there. Skipping them leaves their required statuses pending
  # until a maintainer runs them via `bin/ci-pr`.
  integration:
    when:
      not:
        matches:
          pattern: ^pull/[0-9]+$
          value: << pipeline.git.branch >>
    jobs:
      - build-rest:
          name: build-rest-integration
      - poetry/run:
          name: test-integration-/aio/<<matrix.cwd>>
          commands:
            - run:
                command: poetry run pytest tests/integration
                working_directory: <<matrix.cwd>>
          executor: python-integration
          install_flags: --no-ansi
          # renovate: datasource=pypi depName=poetry
          version: 2.5.1
          pre-steps:
            - run: echo "${GCLOUD_AIO_CI_KEY}" | base64 -d > "${GOOGLE_APPLICATION_CREDENTIALS}"
          matrix:
            alias: test-integration-aio
            parameters:
              cwd: [auth, bigquery, datastore, pubsub, storage, taskqueue]
      - poetry/run:
          name: test-integration-<<matrix.cwd>>
          commands:
            - run:
                command: poetry run pytest tests/integration
                working_directory: <<matrix.cwd>>
          executor: python-integration
          install_flags: --no-ansi
          # renovate: datasource=pypi depName=poetry
          version: 2.5.1
          pre-steps:
            - run: echo "${GCLOUD_AIO_CI_KEY}" | base64 -d > "${GOOGLE_APPLICATION_CREDENTIALS}"
            - attach_workspace:
                at: /rest
          matrix:
            alias: test-integration-rest
            parameters:
              cwd: [/rest/auth, /rest/bigquery, /rest/datastore, /rest/pubsub, /rest/storage, /rest/taskqueue]
          requires:
            - build-rest-integration
