name: release

on:
  push:
    tags:
      - '*-*'

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      statuses: read
    outputs:
      project: ${{ steps.project.outputs.project }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: project
        run: |
          project="${GITHUB_REF_NAME%%-*}"
          case "${project}" in
            auth|bigquery|datastore|kms|pubsub|storage|taskqueue) ;;
            *) echo "::error::unknown project in tag ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          echo "project=${project}" >> "${GITHUB_OUTPUT}"
      - name: check tag is on master
        run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/master
      # Tags are not built on CircleCI: releases rely on the statuses posted
      # by the master pipeline for the same commit.
      - name: wait for CircleCI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 120); do
            states=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status?per_page=100" \
              --jq '.statuses[] | select(.context | startswith("ci/circleci: ")) | .state')
            if [ -z "${states}" ]; then
              echo "no CircleCI statuses yet"
            elif grep -qx -e failure -e error <<< "${states}"; then
              echo "::error::CircleCI failed for ${GITHUB_SHA}"
              exit 1
            elif ! grep -qvx success <<< "${states}"; then
              echo "CircleCI passed for ${GITHUB_SHA}"
              exit 0
            else
              echo "waiting on $(grep -cvx success <<< "${states}") CircleCI job(s)"
            fi
            sleep 30
          done
          echo "::error::timed out waiting for CircleCI"
          exit 1

  build:
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      PROJECT: ${{ needs.verify.outputs.project }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: snok/install-poetry@v1.4.2
        with:
          # renovate: datasource=pypi depName=poetry
          version: 2.5.1
      - name: build gcloud-aio
        run: poetry build --output "${GITHUB_WORKSPACE}/dist"
        working-directory: ${{ env.PROJECT }}
      - run: ./bin/build-rest
      - name: build gcloud-rest
        run: poetry build --output "${GITHUB_WORKSPACE}/dist"
        working-directory: build/${{ env.PROJECT }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: [verify, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      PROJECT: ${{ needs.verify.outputs.project }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: create changelog
        run: |
          prev_release=$(git tag --sort=version:refname | grep "^${PROJECT}-" | tail -n2 | head -n1)
          if [ -z "${prev_release}" ] || [ "${prev_release}" = "${GITHUB_REF_NAME}" ]; then
            prev_release=$(git rev-list --max-parents=0 HEAD)
          fi
          git log "${prev_release}..${GITHUB_REF_NAME}" --pretty=format:'- %s' \
            | grep "${PROJECT}" > CHANGELOG.md || :
          cat CHANGELOG.md
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md dist/*

  # Each PyPI project's trusted publisher is pinned to this workflow and the
  # `release` environment, whose required reviewers gate publishing.
  publish:
    needs: [verify, build, github-release]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/gcloud-aio-${{ needs.verify.outputs.project }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
