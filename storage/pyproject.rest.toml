[tool.poetry]
name = "gcloud-rest-storage"
version = "9.6.4"
description = "Python Client for Google Cloud Storage"
readme = "README.rst"

repository = "https://github.com/talkiq/gcloud-aio"
authors = ["Vi Engineering <voiceai-eng@dialpad.com>"]
license = "MIT"

packages = [
    { include = "gcloud" },
]

classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Topic :: Internet',
]

[tool.poetry.dependencies]
python = ">= 3.10, < 4.0"
# aiofiles = ">=0.6.0, <26.0.0"
# See https://cryptography.io/en/latest/api-stability/#deprecation
cryptography = ">= 3.1.0, < 52.0.0"  # pin max to < (major + 3)
gcloud-rest-auth = ">= 5.4.4, < 6.0.0"

[tool.poetry.group.dev.dependencies]
gcloud-rest-auth = { path = "../auth" }
pytest = "9.1.1"
# pytest-asyncio = "1.4.0"
pytest-mock = "3.15.1"

[[tool.poetry.source]]
name = "pypi"
priority = "primary"

[tool.pytest.ini_options]
# addopts = "-Werror"  # TODO: fixme
# asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
